<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="bg">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#bg)">
    <!-- Sky background -->
    <rect width="512" height="512" fill="#0d1a28"/>

    <!-- Underground section — subtle split at horizon -->
    <rect x="0" y="196" width="512" height="316" fill="#08131e"/>

    <!-- Deeper zone -->
    <rect x="0" y="310" width="512" height="202" fill="#050e17"/>

    <!-- Ground horizon line -->
    <line x1="32" y1="196" x2="480" y2="196"
          stroke="#f59e0b" stroke-width="9" stroke-linecap="round"/>

    <!-- Electrode assembly: dot + stake (5 electrodes) -->
    <!-- Electrode 1 -->
    <line x1="96"  y1="196" x2="96"  y2="232" stroke="#d48508" stroke-width="5" stroke-linecap="round"/>
    <circle cx="96"  cy="189" r="15" fill="#f59e0b"/>
    <!-- Electrode 2 -->
    <line x1="176" y1="196" x2="176" y2="232" stroke="#d48508" stroke-width="5" stroke-linecap="round"/>
    <circle cx="176" cy="189" r="15" fill="#f59e0b"/>
    <!-- Electrode 3 (centre — slightly larger) -->
    <line x1="256" y1="196" x2="256" y2="232" stroke="#d48508" stroke-width="5" stroke-linecap="round"/>
    <circle cx="256" cy="189" r="17" fill="#fbbf24"/>
    <!-- Electrode 4 -->
    <line x1="336" y1="196" x2="336" y2="232" stroke="#d48508" stroke-width="5" stroke-linecap="round"/>
    <circle cx="336" cy="189" r="15" fill="#f59e0b"/>
    <!-- Electrode 5 -->
    <line x1="416" y1="196" x2="416" y2="232" stroke="#d48508" stroke-width="5" stroke-linecap="round"/>
    <circle cx="416" cy="189" r="15" fill="#f59e0b"/>

    <!-- Current flow lines from electrodes (subtle) -->
    <line x1="96"  y1="232" x2="176" y2="232" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 6" opacity="0.25"/>
    <line x1="176" y1="232" x2="256" y2="232" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 6" opacity="0.25"/>
    <line x1="256" y1="232" x2="336" y2="232" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 6" opacity="0.25"/>
    <line x1="336" y1="232" x2="416" y2="232" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 6" opacity="0.25"/>

    <!-- Water anomaly — outer glow -->
    <path d="M 32 390 C 80 300 150 265 220 300 C 290 335 350 355 400 290 C 430 258 458 252 480 260"
          stroke="#38bdf8" stroke-width="56" fill="none"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.10"/>

    <!-- Water anomaly — mid glow -->
    <path d="M 32 390 C 80 300 150 265 220 300 C 290 335 350 355 400 290 C 430 258 458 252 480 260"
          stroke="#38bdf8" stroke-width="32" fill="none"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.18"/>

    <!-- Water anomaly — main line -->
    <path d="M 32 390 C 80 300 150 265 220 300 C 290 335 350 355 400 290 C 430 258 458 252 480 260"
          stroke="#38bdf8" stroke-width="16" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Water peak highlight (brightest point of anomaly) -->
    <circle cx="220" cy="300" r="28" fill="#38bdf8" opacity="0.20"/>
    <circle cx="220" cy="300" r="13" fill="#7dd3fc"/>
    <circle cx="220" cy="300" r="6"  fill="#e0f2fe"/>
  </g>
</svg>
